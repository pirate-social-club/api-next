name: secret-boundary

# Trusted check. It runs base branch code under pull_request_target and never
# checks out, installs, or executes pull request code: the checker only reads
# changed file contents through the GitHub API. It holds no credential beyond
# the read-only GITHUB_TOKEN, so a hostile pull request has nothing to steal.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: secret-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-boundary:
    name: secret-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Explicit base commit: never the pull request head, and no credentials
      # left behind in the checkout.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # No dependency install: the checker uses only Bun and fetch.
      - name: Check pull request secret boundary
        run: bun scripts/secret-boundary-check.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
