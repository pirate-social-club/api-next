name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history: the breaking-change check diffs against the pushed
      # commit's first parent or the pull request base commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Start warn-only egress audit
        uses: ironsh/iron-proxy-action@fa1fd82ec32396d044deba7040a6db576bec927a # v0.1.4
        with:
          version: 0.41.0
          egress-rules: .github/egress/check.yml
          warn: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run check:fresh
      - name: Resolve OpenAPI baseline
        id: openapi-baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test -n "$PR_BASE_SHA"
            baseline="$PR_BASE_SHA"
          else
            baseline="$(git rev-parse --verify "$PUSH_SHA^1")"
          fi
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"
      - run: bun run check:breaking
        env:
          OPENAPI_BASE_SHA: ${{ steps.openapi-baseline.outputs.sha }}
      - name: Wrangler dry run (jobs worker)
        run: bunx wrangler deploy --dry-run --env "" --config apps/jobs-worker/wrangler.jsonc
      - name: Wrangler dry run (HTTP worker)
        run: bunx wrangler deploy --dry-run --env "" --config apps/http-worker/wrangler.jsonc
      - name: Show egress audit summary
        if: always()
        uses: ironsh/iron-proxy-action/summary@fa1fd82ec32396d044deba7040a6db576bec927a # v0.1.4

  postgres17:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Service images are pulled before steps, so Iron Proxy cannot observe
        # this fetch. Keep the reviewed PostgreSQL 17.11 index immutable here.
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Start warn-only egress audit
        uses: ironsh/iron-proxy-action@fa1fd82ec32396d044deba7040a6db576bec927a # v0.1.4
        with:
          version: 0.41.0
          egress-rules: .github/egress/postgres17.yml
          warn: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Verify generated PostgreSQL baseline freshness
        env:
          CONTROL_PLANE_POSTGRES_GENERATOR_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          CONTROL_PLANE_POSTGRES_IMAGE: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
          CONTROL_PLANE_POSTGRES_SERVER_DUMP: "1"
        run: bun run check:baseline:fresh
      - name: Remove stale completion sentinel
        run: >-
          rm -f
          /tmp/api-next-control-plane-postgres-adapter-suite-complete
          /tmp/api-next-control-plane-postgres-foundation-suite-complete
          /tmp/api-next-control-plane-postgres-media-persistence-suite-complete
          /tmp/api-next-control-plane-postgres-optional-route-v2-suite-complete
          /tmp/api-next-control-plane-postgres-namespace-ownership-suite-complete
          /tmp/api-next-control-plane-postgres-migration-suite-complete
          /tmp/api-next-control-plane-postgres-identity-suite-complete
          /tmp/api-next-control-plane-postgres-community-suite-complete
          /tmp/api-next-control-plane-postgres-community-creation-suite-complete
          /tmp/api-next-control-plane-postgres-canonical-route-suite-complete
          /tmp/api-next-control-plane-postgres-gates-v2-community-suite-complete
          /tmp/api-next-control-plane-postgres-feed-suite-complete
          /tmp/api-next-control-plane-postgres-content-suite-complete
          /tmp/api-next-control-plane-postgres-text-submission-suite-complete
          /tmp/api-next-control-plane-postgres-persona-suite-complete
          /tmp/api-next-control-plane-postgres-rewards-qualification-suite-complete
          /tmp/api-next-control-plane-postgres-rewards-song-offers-suite-complete
          /tmp/api-next-control-plane-postgres-public-profile-suite-complete
          /tmp/api-next-control-plane-postgres-public-community-threads-suite-complete
          /tmp/api-next-control-plane-postgres-verification-suite-complete
          /tmp/api-next-control-plane-postgres-verification-start-suite-complete
          /tmp/api-next-control-plane-postgres-community-purchase-funding-suite-complete
          /tmp/api-next-control-plane-postgres-hns-observer-suite-complete
          /tmp/api-next-control-plane-postgres-hns-host-persistence-suite-complete
          /tmp/api-next-control-plane-postgres-handle-sales-suite-complete
          /tmp/api-next-control-plane-postgres-community-moderation-suite-complete
          /tmp/api-next-control-plane-postgres-platform-pirate-rename-suite-complete
          /tmp/api-next-control-plane-postgres-dance-reference-suite-complete
      - name: Run required Postgres 17 suite
        env:
          CONTROL_PLANE_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          CONTROL_PLANE_POSTGRES_TEST_REQUIRED: "1"
          CONTROL_PLANE_POSTGRES_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-adapter-suite-complete
          CONTROL_PLANE_POSTGRES_FOUNDATION_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-foundation-suite-complete
          CONTROL_PLANE_POSTGRES_MEDIA_PERSISTENCE_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-media-persistence-suite-complete
          CONTROL_PLANE_POSTGRES_OPTIONAL_ROUTE_V2_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-optional-route-v2-suite-complete
          CONTROL_PLANE_POSTGRES_NAMESPACE_OWNERSHIP_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-namespace-ownership-suite-complete
          CONTROL_PLANE_POSTGRES_MIGRATION_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-migration-suite-complete
          CONTROL_PLANE_POSTGRES_IDENTITY_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-identity-suite-complete
          CONTROL_PLANE_POSTGRES_COMMUNITY_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-community-suite-complete
          CONTROL_PLANE_POSTGRES_COMMUNITY_CREATION_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-community-creation-suite-complete
          CONTROL_PLANE_POSTGRES_CANONICAL_ROUTE_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-canonical-route-suite-complete
          CONTROL_PLANE_POSTGRES_GATES_V2_COMMUNITY_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-gates-v2-community-suite-complete
          CONTROL_PLANE_POSTGRES_FEED_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-feed-suite-complete
          CONTROL_PLANE_POSTGRES_CONTENT_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-content-suite-complete
          CONTROL_PLANE_POSTGRES_TEXT_SUBMISSION_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-text-submission-suite-complete
          CONTROL_PLANE_POSTGRES_PERSONA_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-persona-suite-complete
          CONTROL_PLANE_POSTGRES_REWARDS_QUALIFICATION_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-rewards-qualification-suite-complete
          CONTROL_PLANE_POSTGRES_REWARDS_SONG_OFFERS_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-rewards-song-offers-suite-complete
          CONTROL_PLANE_POSTGRES_PUBLIC_PROFILE_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-public-profile-suite-complete
          CONTROL_PLANE_POSTGRES_PUBLIC_COMMUNITY_THREADS_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-public-community-threads-suite-complete
          CONTROL_PLANE_POSTGRES_VERIFICATION_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-verification-suite-complete
          CONTROL_PLANE_POSTGRES_VERIFICATION_START_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-verification-start-suite-complete
          CONTROL_PLANE_POSTGRES_COMMUNITY_PURCHASE_FUNDING_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-community-purchase-funding-suite-complete
          CONTROL_PLANE_POSTGRES_HNS_OBSERVER_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-hns-observer-suite-complete
          CONTROL_PLANE_POSTGRES_HNS_HOST_PERSISTENCE_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-hns-host-persistence-suite-complete
          CONTROL_PLANE_POSTGRES_HANDLE_SALES_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-handle-sales-suite-complete
          CONTROL_PLANE_POSTGRES_COMMUNITY_MODERATION_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-community-moderation-suite-complete
          CONTROL_PLANE_POSTGRES_PLATFORM_PIRATE_RENAME_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-platform-pirate-rename-suite-complete
          CONTROL_PLANE_POSTGRES_DANCE_REFERENCE_TEST_SENTINEL: /tmp/api-next-control-plane-postgres-dance-reference-suite-complete
        run: |
          set -euo pipefail
          # The runner discovers every tracked *.pg.test.ts file, isolates the
          # database-time namespace suite, and caps general concurrency at four.
          bun run test:postgres
      - name: Verify Postgres 17 completion sentinel
        run: bun run verify:postgres-sentinels
      - name: Show egress audit summary
        if: always()
        uses: ironsh/iron-proxy-action/summary@fa1fd82ec32396d044deba7040a6db576bec927a # v0.1.4
