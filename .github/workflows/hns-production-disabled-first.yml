name: hns-production-disabled-first

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character source commit to deploy
        required: true
        type: string
      expected_bundle_sha256:
        description: SHA-256 of the exact dry-run Worker index.js
        required: true
        type: string
      confirmation:
        description: Type deploy-disabled-first
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hns-production-disabled-first-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Verify exact disabled-first dispatch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BUNDLE_SHA256: ${{ inputs.expected_bundle_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$CONFIRMATION" == "deploy-disabled-first" ]]
          latest_migration="$(find db/postgres/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort | tail -1)"
          [[ "$latest_migration" == "0065_text_ratings_age_access.sql" ]]
      - run: bun install --frozen-lockfile
      - name: Verify production switches remain disabled
        run: >-
          bun -e 'import { parseJsonc } from "./scripts/secret-drift-audit.ts";
          const config = parseJsonc(await Bun.file("apps/http-worker/wrangler.jsonc").text());
          const vars = config.env?.production?.vars;
          if (vars?.HNS_OWNERSHIP_ENABLED !== "false" ||
          vars?.HNS_COMMUNITY_APP_API_ENABLED !== "false" ||
          vars?.MEGAPOT_REWARDS_ENABLED !== "false")
          throw new Error("production switch is not disabled");'
      - name: Probe canonical API before mutation
        run: curl --fail --silent --show-error --max-time 10 https://api-next.pirate.sc/health > /dev/null
      - name: Record rollback version
        id: before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          before="$(bunx wrangler deployments list --env production --config apps/http-worker/wrangler.jsonc --json | jq -r '.[-1].versions[] | select(.percentage == 100) | .version_id' | tail -1)"
          [[ "$before" =~ ^[0-9a-f-]{36}$ ]]
          echo "version=$before" >> "$GITHUB_OUTPUT"
          echo "Rollback Worker version: \`$before\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Install production forwarder registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HNS_FORWARDER_V3_HMAC_KEY_REGISTRY: ${{ secrets.HNS_FORWARDER_V3_HMAC_KEY_REGISTRY }}
        run: |
          set -euo pipefail
          test -n "${HNS_FORWARDER_V3_HMAC_KEY_REGISTRY:-}"
          node -e 'process.stdout.write(JSON.stringify({HNS_FORWARDER_V3_HMAC_KEY_REGISTRY: process.env.HNS_FORWARDER_V3_HMAC_KEY_REGISTRY}))' |
            bunx wrangler secret bulk --env production --config apps/http-worker/wrangler.jsonc
      - name: Verify production secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bunx wrangler secret list --env production --config apps/http-worker/wrangler.jsonc --json > "$RUNNER_TEMP/api-secret-names.json"
          node -e 'const rows=JSON.parse(await Bun.file(process.argv[1]).text()); const names=new Set(rows.map(row=>row.name)); if (!names.has("HNS_FORWARDER_V3_HMAC_KEY_REGISTRY")) throw new Error("forwarder registry is absent");' "$RUNNER_TEMP/api-secret-names.json"
      - name: Credential-safe production dry run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_BUNDLE_SHA256: ${{ inputs.expected_bundle_sha256 }}
        run: |
          set -euo pipefail
          bunx wrangler deploy --dry-run --env production \
            --config apps/http-worker/wrangler.jsonc \
            --outdir "$RUNNER_TEMP/api-worker-bundle"
          observed="$(sha256sum "$RUNNER_TEMP/api-worker-bundle/index.js" | cut -d ' ' -f 1)"
          [[ "$observed" == "$EXPECTED_BUNDLE_SHA256" ]]
      - name: Deploy production API with HNS disabled
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          bunx wrangler deploy --env production
          --config apps/http-worker/wrangler.jsonc
          --message "HNS disabled-first ${{ inputs.expected_sha }}"
      - name: Probe canonical API after deployment
        run: curl --fail --silent --show-error --max-time 10 https://api-next.pirate.sc/health > /dev/null
      - name: Record deployed version and protected domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          after="$(bunx wrangler deployments list --env production --config apps/http-worker/wrangler.jsonc --json | jq -r '.[-1].versions[] | select(.percentage == 100) | .version_id' | tail -1)"
          [[ "$after" =~ ^[0-9a-f-]{36}$ ]]
          test "$after" != "${{ steps.before.outputs.version }}"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/08a4c22cf52e2ecae883e36f80a33f4a/workers/domains?hostname=hns-community-api.pirate.sc" \
            --output "$RUNNER_TEMP/api-domain.json"
          domain="$(jq -r '.result[] | select(.hostname == "hns-community-api.pirate.sc" and .service == "pirate-http-worker-production") | [.id, .hostname, .service, .cert_id] | @tsv' "$RUNNER_TEMP/api-domain.json")"
          test -n "$domain"
          echo "Deployed Worker version: \`$after\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Protected Custom Domain: \`$domain\`" >> "$GITHUB_STEP_SUMMARY"
