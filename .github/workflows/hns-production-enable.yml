name: hns-production-enable

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to deploy
        required: true
        type: string
      confirmation:
        description: Type enable-production-community
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hns-production-enable-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Verify exact enabled dispatch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMATION" == "enable-production-community" ]]
          latest_migration="$(find db/postgres/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort | tail -1)"
          [[ "$latest_migration" == "0068_general_audience_song_covers.sql" ]]
      - run: bun install --frozen-lockfile
      - name: Verify production community graph
        run: >-
          bun -e 'import { parseJsonc } from "./scripts/secret-drift-audit.ts";
          const config = parseJsonc(await Bun.file("apps/http-worker/wrangler.jsonc").text());
          const vars = config.env?.production?.vars;
          if (vars?.HNS_OWNERSHIP_ENABLED !== "false" ||
          vars?.HNS_COMMUNITY_APP_API_ENABLED !== "true" ||
          vars?.HNS_FORWARDER_V3_KEY_REGISTRY_VERSION !== "2026-08-28-02")
          throw new Error("production community graph mismatch");'
      - name: Verify secret and canonical API before mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 https://api-next.pirate.sc/health > /dev/null
          bunx wrangler secret list --env production --config apps/http-worker/wrangler.jsonc --format json > "$RUNNER_TEMP/secrets.json"
          jq -e 'map(.name) | index("HNS_FORWARDER_V3_HMAC_KEY_REGISTRY") != null' "$RUNNER_TEMP/secrets.json" > /dev/null
      - name: Record rollback version
        id: before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          before="$(bunx wrangler deployments list --env production --config apps/http-worker/wrangler.jsonc --json | jq -r '.[-1].versions[] | select(.percentage == 100) | .version_id' | tail -1)"
          [[ "$before" =~ ^[0-9a-f-]{36}$ ]]
          echo "version=$before" >> "$GITHUB_OUTPUT"
          echo "Rollback Worker version: \`$before\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and deploy enabled production API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bunx wrangler deploy --dry-run --env production --config apps/http-worker/wrangler.jsonc --outdir "$RUNNER_TEMP/bundle"
          digest="$(sha256sum "$RUNNER_TEMP/bundle/index.js" | cut -d ' ' -f 1)"
          echo "Bundle SHA-256: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          bunx wrangler deploy --env production --config apps/http-worker/wrangler.jsonc --message "HNS community enabled $GITHUB_SHA"
      - name: Verify enabled production API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 https://api-next.pirate.sc/health > /dev/null
          after="$(bunx wrangler deployments list --env production --config apps/http-worker/wrangler.jsonc --json | jq -r '.[-1].versions[] | select(.percentage == 100) | .version_id' | tail -1)"
          [[ "$after" =~ ^[0-9a-f-]{36}$ ]]
          test "$after" != "${{ steps.before.outputs.version }}"
          echo "Enabled Worker version: \`$after\`" >> "$GITHUB_STEP_SUMMARY"
