name: secret-drift

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secret-drift
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Audit Cloudflare secret names
        run: bun run audit:secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Audit Infisical secret names
        run: bun run audit:infisical
        env:
          INFISICAL_MACHINE_IDENTITY_ID: a4c9780d-f83b-42cb-8c5e-e493439d374d
          INFISICAL_OIDC_AUDIENCE: https://github.com/pirate-social-club
