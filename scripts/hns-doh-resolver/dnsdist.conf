-- dnsdist frontend for the Pirate HNS DoH resolver.
--
-- TLS is terminated by Caddy on dns.pirate.sc, which reverse-proxies cleartext
-- HTTP/2 here. That is deliberate: Caddy already owns :443 on this host and
-- already manages the Let's Encrypt lifecycle, so terminating TLS in dnsdist
-- would duplicate cert issuance/renewal across two daemons for no gain.
--
-- Consequence: this listener MUST stay on loopback. It speaks cleartext.
addDOHLocal("127.0.0.1:8053", nil, nil, "/dns-query", {
  reusePort = true,
  -- Caddy is the only client; it sets X-Forwarded-For so per-client limits below
  -- apply to real clients rather than to Caddy's single loopback address.
  trustForwardedForHeader = true,
})

-- dnsdist's default ACL is loopback plus RFC1918. Because trustForwardedForHeader
-- is set above, the ACL is evaluated against the FORWARDED client address, not
-- Caddy's loopback address -- so every real client was rejected with
-- "DoH query not allowed because of ACL" while the loopback path worked fine.
--
-- This is a deliberately public resolver, so the ACL is not the control that
-- keeps it safe: the per-client QPS limit, the TCP caps and the rejected query
-- types below are. Opening the ACL here makes that explicit rather than relying
-- on a default that silently contradicts the service's purpose.
setACL({"0.0.0.0/0", "::/0"})

-- hnsd SPV resolver. Single backend, so a health-check failure means the service
-- is down; dnsdist will SERVFAIL rather than silently answer from a stale cache.
newServer({
  address = "127.0.0.1:5350",
  name = "hnsd",
  checkName = ".",
  checkType = "NS",
  checkInterval = 10,
  maxCheckFailures = 3,
})

-- Zone transfers are meaningless against a recursor and are a data-exfiltration
-- shape. Refuse them if they reach the dnsdist rule engine. The DoH frontend
-- may reject transfer requests earlier with NOTIMP instead of reaching this
-- action; both outcomes expose no zone data.
addAction(OrRule({ QTypeRule(DNSQType.AXFR), QTypeRule(DNSQType.IXFR) }), RCodeAction(DNSRCode.REFUSED))

-- ANY is an amplification primitive. DoH is TCP so amplification does not apply,
-- but ANY also produces needless load on an SPV backend.
addAction(QTypeRule(DNSQType.ANY), RCodeAction(DNSRCode.REFUSED))

-- Per-client rate limit. This is a public service; without this a single client
-- can exhaust the SPV pool for everyone.
addAction(MaxQPSIPRule(25, 32, 64), RCodeAction(DNSRCode.REFUSED))

-- Global backpressure guard.
setMaxTCPConnectionsPerClient(20)
setMaxTCPQueriesPerConnection(200)

-- Cache. Keeps repeat lookups off the SPV pool. Bounded so it cannot grow into
-- the memory the verifier's observer needs on this shared box.
local cache = newPacketCache(50000, {
  maxTTL = 3600,
  minTTL = 0,
  temporaryFailureTTL = 60,
  staleTTL = 60,
  dontAge = false,
})
getPool(""):setCache(cache)

-- Privacy: this resolver sees which HNS names users visit. Do not build a log of
-- that. Errors only; no query log.
setVerbose(false)

-- Console/API are not enabled: no controlSocket(), no webserver(). Operate this
-- via the systemd unit and container logs.
