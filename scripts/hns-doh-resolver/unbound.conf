# Unbound options for hnsd's recursive resolver (passed with --rs-config).
#
# hnsd's root nameserver answers names that don't exist with a deliberately
# "phony" NSEC proof, ". NSEC .", which claims the root zone is empty
# (hnsd src/ns.c, hsk_ns_respond). With aggressive NSEC (RFC 8198), Unbound
# reuses that cached proof to deny every top-level domain, real ones included,
# for up to the NSEC TTL (86400 s). One lookup of a non-existent name, such as
# the "_eth." nameserver some TLDs list, is enough to trigger it.
#
# Turning aggressive NSEC off keeps full DNSSEC validation of every answer; it
# only stops proofs for one name being reused to deny other names.
server:
    aggressive-nsec: no
