services:
  # dnsdist is the container recorded in DEPLOYMENT metadata and checked by the
  # drift verifier: it is the digest-pinned, public-facing one. hnsd is built
  # locally and carries no digest to verify; it is covered by its own container
  # healthcheck and by the end-to-end probe in bin/check-doh-health.sh. The role
  # is staged with `--monitored-container pirate-hns-dnsdist` so this is explicit
  # rather than inferred from declaration order.
  doh:
    # Pinned by digest. 1.9.0-1.9.3 carry a remotely triggerable DoH DoS
    # (PowerDNS Security Advisory 2024-03); 1.9.4 fixed it. Do not downgrade.
    image: powerdns/dnsdist-19:1.9.16@sha256:260b1120947a10c494fad4d93cde33ebace34bf4800c88ebb114dd7f9e829809
    container_name: pirate-hns-dnsdist
    restart: unless-stopped
    init: true
    network_mode: host
    read_only: true
    depends_on:
      spv:
        condition: service_healthy
    volumes:
      - ./dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 15s

  spv:
    build:
      context: .
      dockerfile: Dockerfile
    image: pirate-hnsd:2.0.0
    container_name: pirate-hns-spv
    restart: unless-stopped
    init: true
    # host networking so both listeners land on this host's loopback, where
    # dnsdist reaches them. The entrypoint refuses any non-loopback bind.
    network_mode: host
    read_only: true
    user: "${HNSD_UID:-1000}:${HNSD_GID:-1000}"
    environment:
      HNSD_POOL_SIZE: "4"
      HNSD_RS_HOST: 127.0.0.1:15350
      HNSD_NS_HOST: 127.0.0.1:15351
      HNSD_NS_PORT: "15351"
    volumes:
      # Stable host path, deliberately NOT ./data: state must survive checkout
      # replacement and release cleanup. Losing it costs a ~40 minute resync
      # outage, which makes it availability state rather than scratch.
      - ${HNSD_DATA_DIR:-/srv/pirate-hns-doh/shared/spv}:/var/lib/hnsd
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 15s
    healthcheck:
      # Gates on hnsd's own Hesiod status API: chain.synced must be true AND the
      # tip must be recent. A bare "answers root NS" probe is not a sync gate --
      # hnsd answers from partial chain state while catching up, which would
      # serve stale HNS ownership data.
      test: ["CMD", "/usr/local/bin/hnsd-resolver-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Startup tolerance only, NOT a sync gate (the test above is the gate).
      # Measured ~4k blocks/30s, so a first boot from empty state reaches a ~339k
      # tip in roughly 40 minutes. An unhealthy container is not restarted by
      # restart: unless-stopped, but dnsdist's depends_on waits on it, so this
      # only needs to be generous enough to cover a cold sync.
      start_period: 3600s
