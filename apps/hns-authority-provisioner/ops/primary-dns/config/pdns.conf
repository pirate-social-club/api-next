launch=gsqlite3
gsqlite3-database=/var/lib/powerdns/pdns.sqlite3
gsqlite3-dnssec=yes

# Public addresses are process arguments. The API key comes from the private
# api-key.conf mount; its contents never enter the argument vector.
include-dir=/etc/powerdns/pdns.d
local-port=53

# Primary mode. Zones are created as Master (not Native) by the verifier:
# PowerDNS accepts NOTIFY on Native zones but silently drops it, so a Native
# zone would never replicate to the secondary.
primary=yes

# AXFR is denied by IP and authorized by TSIG instead: the verifier grants
# TSIG-ALLOW-AXFR (PDNS_AXFR_TSIG_KEY_NAME) on every zone it provisions, so new
# delegated community zones replicate without touching this file.
# Create the key once:  pdnsutil generate-tsig-key pirate-axfr hmac-sha256
disable-axfr=no
allow-axfr-ips=127.0.0.1

api=yes
webserver=yes
webserver-address=127.0.0.1
webserver-port=8081
webserver-allow-from=127.0.0.1

default-soa-content=ns1.pirate. dns.pirate. 0 3600 900 1209600 300
default-ttl=300

security-poll-suffix=
version-string=anonymous
setuid=
setgid=
