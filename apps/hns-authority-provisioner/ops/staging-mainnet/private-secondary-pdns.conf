launch=gsqlite3
gsqlite3-database=/var/lib/powerdns/pdns.sqlite3
gsqlite3-dnssec=yes
include-dir=/etc/powerdns/pdns.d
local-port=53
api=yes
webserver=yes
webserver-port=8081
webserver-allow-from=127.0.0.0/8
disable-axfr=no
allow-axfr-ips=
allow-unsigned-autoprimary=no
allow-unsigned-notify=no
send-signed-notify=yes
security-poll-suffix=
version-string=anonymous
setuid=
setgid=
local-address=127.0.0.22
webserver-address=127.0.0.22
primary=no
secondary=yes
autosecondary=yes
allow-notify-from=127.0.0.21,94.103.168.209
only-notify=127.0.0.0/8
query-local-address=127.0.0.22
resolver=127.0.0.21:53
